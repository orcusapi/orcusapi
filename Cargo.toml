[package]
name = "soroban-api-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
base64 = "0.23.0"
dotenvy = "0.15.7"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
hex = "0.4.3"
once_cell = "1.21.4"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
stellar-strkey = "0.0.18"
stellar-xdr = { version = "27.0.0", features = ["std", "base64", "serde", "serde_json"] }
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "0.7.0", features = ["cors", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wasmparser = "0.254.0"
